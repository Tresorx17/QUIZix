<header class="app-nav">
  <div class="app-nav__inner">
    <a class="app-nav__brand" routerLink="/">
      <span class="app-nav__logo">Q</span>
      <span class="app-nav__name">QUIZix</span>
    </a>

    @if (user(); as u) {
      <nav class="app-nav__links">
        @if (u.role === 'teacher') {
          <a class="app-nav__link" routerLink="/dashboard">Tableau de bord</a>
        } @else {
          <a class="app-nav__link" routerLink="/catalog">Catalogue</a>
        }
        <a class="app-nav__link" routerLink="/leaderboard">Classement</a>
      </nav>
    }

    <div class="app-nav__user">
      @if (user(); as u) {
        <span class="app-nav__role-badge">{{ u.role === 'teacher' ? 'Enseignant' : 'Élève' }}</span>
        <span class="app-nav__username">{{ user()?.displayName }}</span>
      }
      <button class="app-nav__logout" (click)="logout()">Se déconnecter</button>
    </div>
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>
